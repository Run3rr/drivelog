<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriveLog</title>
<style>
:root{--bg:#f2faf5;--card:#fff;--tx:#0f2419;--mut:#587163;--g:#0e8450;--gl:#dff3e8;--p:#d81b60;--onp:#fff;--on:#fff;--bd:#cfe3d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a130f;--card:#13211a;--tx:#e6f4ec;--mut:#8dac9b;--g:#3ddc97;--gl:#173427;--p:#ff6fae;--onp:#2b0817;--on:#05210f;--bd:#254236}}
:root[data-theme="dark"]{--bg:#0a130f;--card:#13211a;--tx:#e6f4ec;--mut:#8dac9b;--g:#3ddc97;--gl:#173427;--p:#ff6fae;--onp:#2b0817;--on:#05210f;--bd:#254236}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.5rem;color:var(--g)}
h2{margin:0;font-size:1.2rem}
section{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}
.hero{text-align:center;padding:8px 0}
.go{width:190px;height:190px;border-radius:50%;border:0;margin:20px auto 8px;display:block;background:var(--p);color:var(--onp);font:inherit;font-size:1.4rem;font-weight:800;cursor:pointer;box-shadow:0 0 0 14px var(--gl)}
.mut{color:var(--mut);margin:6px 0 0;font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
label:first-child{margin-top:0}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:none;border-color:var(--p)}
.big{font-size:2rem;font-weight:700;text-align:center}
.btn{border:0;border-radius:14px;padding:16px;width:100%;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;background:var(--g);color:var(--on)}
.btn.p{background:var(--p);color:var(--onp);padding:22px;font-size:1.3rem}
.btn.ghost{background:none;color:var(--g);border:2px solid var(--bd)}
.btn.sm{width:auto;padding:8px 12px;font-size:.85rem}
.btn:focus-visible,.go:focus-visible,.ic:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.ic{border:1px solid var(--bd);background:var(--card);border-radius:50%;width:42px;height:42px;font-size:1.1rem;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tr{padding:10px 0;border-top:1px solid var(--bd)}
.tr small{display:block;color:var(--mut)}
.tr em{color:var(--p);font-style:normal;font-weight:700}
.car{display:flex;gap:8px;margin-bottom:8px}
.pick{flex:1;text-align:left;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer}
.pick small{display:block;font-weight:400;color:var(--mut)}
.pick.on{border-color:var(--g);background:var(--gl)}
.pick.on::after{content:"✓";float:right;color:var(--g)}
.del{border:2px solid var(--bd);background:none;color:var(--mut);border-radius:14px;padding:0 12px;font:inherit;cursor:pointer}
.pick:focus-visible,.del:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--p);margin-right:8px;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.km{font-size:3.2rem;font-weight:800;color:var(--g);margin:8px 0}
</style>
</head>
<body>
<div class="app">
<header><h1>DriveLog</h1><button id="theme" class="ic" aria-label="Zwischen hellem und dunklem Modus wechseln"></button></header>

<section id="sHome">
 <div class="hero"><button id="start" class="go">Fahrt starten</button><p class="mut" id="hint"></p></div>
 <div class="card"><label for="name">Fahrername (ersetzt die Unterschrift)</label><input id="name" placeholder="Vor- und Nachname" autocomplete="name"></div>
 <div class="card"><div class="row"><h2>Meine Fahrzeuge</h2><button id="addBtn" class="btn ghost sm">Hinzufügen</button></div><div id="cars"></div>
  <div id="addBox" hidden><label for="plate">Kennzeichen</label><input id="plate" placeholder="F-AB 1234" autocapitalize="characters"><label for="cname">Modell oder Bezeichnung (optional)</label><input id="cname" placeholder="VW Golf, Poolfahrzeug 3"><button id="saveCar" class="btn" style="margin-top:12px">Fahrzeug speichern</button></div></div>
 <div class="card"><div class="row"><h2>Fahrtenbuch</h2><button id="copy" class="btn ghost sm">Für SAP kopieren</button></div><div id="list"></div></div>
</section>

<section id="sLoc" hidden>
 <h2 id="locT"></h2>
 <div class="card"><label for="addr">Erkannte Adresse, bei Fehlern bitte korrigieren</label><input id="addr" placeholder="Straße Nr., PLZ Ort"><p id="st" class="mut"></p></div>
 <button id="locOk" class="btn">Ja, Adresse stimmt</button>
 <button id="again" class="btn ghost">Erneut orten</button>
 <button class="btn ghost x">Abbrechen</button>
</section>

<section id="sOdo" hidden>
 <h2 id="odoT"></h2>
 <div class="card" id="prop" hidden><p class="mut" id="propT" style="margin:0">Stimmt dieser Kilometerstand?</p><div class="km" id="propK"></div><p class="mut" id="propS" style="margin:0"></p></div><div class="card" id="odoCard"><label for="odo">Aktueller Kilometerstand (km)</label><input id="odo" class="big" type="number" inputmode="numeric" min="0"><p id="odoH" class="mut"></p></div>
 <button id="odoOk" class="btn"></button><button id="odoEdit" class="btn ghost" hidden>Ändern</button>
 <button class="btn ghost x">Abbrechen</button>
</section>

<section id="sDrive" hidden>
 <div class="card"><p style="margin:0;font-weight:700"><i class="dot"></i>Unterwegs <span id="dCar"></span></p><p class="mut" id="dFrom"></p><div class="km" id="dKm">0.0 km</div><p class="mut" id="dT"></p><p class="mut" id="dG"></p></div>
 <button id="stop" class="btn p">Fahrt beenden</button>
</section>

<section id="sDone" hidden>
 <div class="card" id="sum"></div>
 <button id="fin" class="btn">Zurück zum Start</button>
</section>
</div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const ls={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nf=n=>String(n).replace('.',','),nk=n=>Number(n).toLocaleString('de-DE');const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,p=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(p))};
const dt=t=>new Date(t).toLocaleDateString('de-DE'),tm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
let trips=ls.g('trips',[]),cars=ls.g('cars',[]),sel=ls.g('car',null),adding=false,cur=ls.g('cur',null),mode='start',tmp={},wid,wl,tick;
const go=id=>document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id);
const isDark=()=>R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const ico=()=>{$('#theme').textContent=isDark()?'☀️':'🌙'};

function render(){
  $('#list').innerHTML=trips.length?trips.map(t=>`<div class="tr"><b>${esc(t.from)}</b> → <b>${esc(t.to)}</b><small>${t.plate?esc(t.plate)+', ':''}${dt(t.t0)} ${tm(t.t0)}, Kilometerstand ${t.k0} bis ${t.k1}, <em>${nf(t.km)} km</em></small></div>`).join(''):'<p class="mut">Noch keine Fahrten. Abgeschlossene Fahrten erscheinen hier.</p>';
}
function renderCars(){
  if(!cars.some(c=>c.id===sel))sel=cars[0]?cars[0].id:null;
  const cc=cars.find(c=>c.id===sel);
  $('#hint').textContent=cc?'Fahrzeug: '+cc.plate+(cc.name?' ('+cc.name+')':''):'Zum Starten unten ein Fahrzeug hinzufügen';
  $('#cars').innerHTML=cars.length?'<div role="radiogroup" aria-label="Fahrzeug auswählen">'+cars.map(c=>`<div class="car"><button class="pick${c.id===sel?' on':''}" role="radio" aria-checked="${c.id===sel}" data-id="${c.id}">${esc(c.plate)}${c.name?`<small>${esc(c.name)}</small>`:''}</button><button class="del" data-del="${c.id}" aria-label="Fahrzeug ${esc(c.plate)} entfernen">✕</button></div>`).join('')+'</div>':'<p class="mut">Noch kein Fahrzeug. Einmal hinzufügen, dann steht es bei jedem Öffnen der App bereit.</p>';
  $('#addBox').hidden=!(adding||!cars.length);$('#addBtn').hidden=!cars.length;
}
async function rev(la,lo){
  try{
    const c=new AbortController();setTimeout(()=>c.abort(),5000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&zoom=18`,{signal:c.signal});
    const a=(await r.json()).address||{};
    return [[a.road,a.house_number].filter(Boolean).join(' '),[a.postcode,a.city||a.town||a.village].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  }catch(e){return ''}
}
const fix=(ok,bad)=>navigator.geolocation.getCurrentPosition(ok,e=>e.code===1?bad(e):navigator.geolocation.getCurrentPosition(ok,bad,{timeout:15000,maximumAge:6e4}),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
const gpsMsg=e=>(e.code===1?'Der Standortzugriff ist für diese Seite blockiert. Bitte in den Browser- oder Handy-Einstellungen erlauben'+(top!==self?' oder die Seite direkt im Browser statt in einer anderen App öffnen':'')+'.':e.code===3?'Das Gerät braucht zu lange für die Ortung. Ortungsdienste prüfen oder ins Freie gehen.':'Das Gerät konnte keinen Standort ermitteln. Bitte Ortungsdienste prüfen.')+' ('+(e.message||'Fehler '+e.code)+')';
function locate(){
  const a=$('#addr'),st=$('#st');a.value='';tmp.pos=null;st.textContent='Standort wird ermittelt…';
  if(!navigator.geolocation){st.textContent='GPS ist nicht verfügbar. Adresse bitte eintippen.';return}
  fix(async p=>{
    const la=p.coords.latitude,lo=p.coords.longitude,b=`GPS ${la.toFixed(5)}, ${lo.toFixed(5)}, Genauigkeit ${Math.round(p.coords.accuracy)} m`;
    tmp.pos={la,lo};st.textContent=b+'. Straße wird gesucht…';
    const s=await rev(la,lo);
    if(s)a.value=s;
    st.textContent=b+(s?'.':'. Straßensuche nicht verfügbar, bitte Adresse eintippen.');
  },e=>{st.textContent=gpsMsg(e)+' Die Adresse kann stattdessen eingetippt werden.'});
}
function ask(){
  $('#locT').textContent=mode==='start'?'Wo startet die Fahrt?':'Wo ist die Fahrt zu Ende?';
  document.querySelectorAll('.x').forEach(b=>b.hidden=mode!=='start');
  go('sLoc');locate();
}
function drive(){
  go('sDrive');$('#dFrom').textContent='Von '+cur.from;$('#dCar').textContent=cur.plate||'';$('#dG').textContent='Warte auf genaues GPS-Signal…';
  const u=()=>{const m=Math.floor((Date.now()-cur.t0)/6e4);$('#dKm').textContent=nf(cur.gps.toFixed(1))+' km';$('#dT').textContent=`${Math.floor(m/60)} Std. ${m%60} Min. unterwegs, Kilometerstand bei Start ${cur.k0} km`};
  u();clearInterval(tick);tick=setInterval(u,1000);
  wid=navigator.geolocation?.watchPosition(p=>{
    if(!cur||p.coords.accuracy>50)return;
    const la=p.coords.latitude,lo=p.coords.longitude,l=cur.last;
    if(!l)cur.last={la,lo};
    else{const d=hav(l.la,l.lo,la,lo);if(d>.01){cur.gps+=d;cur.last={la,lo}}}
    ls.s('cur',cur);$('#dG').textContent='';u();
  },e=>{$('#dG').textContent=gpsMsg(e)+' Die Strecke wird nicht aufgezeichnet, die Kilometerstände werden aber trotzdem gespeichert.'},{enableHighAccuracy:true,maximumAge:2000});
  navigator.wakeLock?.request('screen').then(w=>wl=w).catch(()=>{});
}

$('#theme').onclick=()=>{const n=isDark()?'light':'dark';R.dataset.theme=n;ls.s('theme',n);ico()};
{const e=$('#name');e.value=ls.g('name','');e.oninput=()=>ls.s('name',e.value)}
$('#cars').onclick=e=>{
  const p=e.target.closest('.pick'),d=e.target.closest('.del');
  if(p){sel=p.dataset.id;ls.s('car',sel);renderCars()}
  if(d){
    if(d.dataset.arm){cars=cars.filter(c=>c.id!==d.dataset.del);ls.s('cars',cars);renderCars()}
    else{d.dataset.arm=1;d.textContent='Entfernen?';setTimeout(()=>{d.dataset.arm='';d.textContent='✕'},2500)}
  }
};
$('#addBtn').onclick=()=>{adding=!adding;renderCars();if(adding)$('#plate').focus()};
$('#saveCar').onclick=()=>{
  const p=$('#plate').value.trim().toUpperCase();if(!p){$('#plate').focus();return}
  const c={id:String(Date.now()),plate:p,name:$('#cname').value.trim()};
  cars.push(c);sel=c.id;ls.s('cars',cars);ls.s('car',sel);
  $('#plate').value='';$('#cname').value='';adding=false;renderCars();
};
$('#start').onclick=()=>{
  const n=$('#name');if(!n.value.trim()){n.placeholder='Erst den Namen eingeben';n.focus();return}
  if(!sel){adding=true;renderCars();$('#plate').placeholder='Erst ein Fahrzeug hinzufügen';$('#plate').focus();return}
  mode='start';tmp={};ask();
};
$('#again').onclick=locate;$('#odoEdit').onclick=()=>{$('#prop').hidden=true;$('#odoCard').hidden=false;$('#odoEdit').hidden=true;$('#odoOk').textContent='Fahrt speichern';$('#odo').focus();$('#odo').select()};
document.querySelectorAll('.x').forEach(b=>b.onclick=()=>go('sHome'));
$('#locOk').onclick=()=>{
  const a=$('#addr').value.trim();if(!a){$('#addr').focus();return}
  tmp.addr=a;const s=mode==='start';
  $('#odoT').textContent=s?'Kilometerstand vor der Fahrt':'Kilometerstand bei Ankunft';
  const lt=s&&trips.find(t=>t.carId===sel);$('#odoH').textContent=s?(lt?'Vom letzten Eintrag dieses Fahrzeugs übernommen, bei Bedarf ändern.':''):`Start war bei ${cur.k0} km`;
  $('#odoOk').textContent=s?'Fahrt starten':'Ja, stimmt';
  $('#odo').value=lt?lt.k1:'';$('#prop').hidden=s;$('#odoCard').hidden=!s;$('#odoEdit').hidden=s;if(!s){const g0=cur.gps+(tmp.pos&&cur.last?hav(cur.last.la,cur.last.lo,tmp.pos.la,tmp.pos.lo):0),d0=cur.p0&&tmp.pos?hav(cur.p0.la,cur.p0.lo,tmp.pos.la,tmp.pos.lo):0,g=Math.max(g0,d0),n=Math.round(cur.k0+g);$('#odo').value=n;$('#propK').textContent=nk(n)+' km';$('#propS').textContent=`${nk(cur.k0)} km Start + ${nf(g.toFixed(1))} km gefahren`+(d0>g0+.05?'. Die GPS-Aufzeichnung war unterbrochen, die Strecke ist nur als Luftlinie geschätzt. Bitte am Tacho prüfen.':g<.1?'. Keine Strecke per GPS aufgezeichnet. Bitte am Tacho prüfen.':'')}
  go('sOdo');$('#odo').focus();
};
$('#odoOk').onclick=()=>{
  const v=$('#odo').value,k=Number(v);
  if(v===''||k<0){$('#odo').focus();return}
  if(mode==='start'){const c=cars.find(x=>x.id===sel)||{};cur={t0:Date.now(),from:tmp.addr,k0:k,gps:0,last:tmp.pos||null,p0:tmp.pos||null,carId:sel,plate:c.plate||''};ls.s('cur',cur);drive();return}
  if(k<cur.k0){$('#odoH').textContent='Mindestens '+cur.k0+' km, so viel wie beim Start.';return}
  if(tmp.pos&&cur.last)cur.gps+=hav(cur.last.la,cur.last.lo,tmp.pos.la,tmp.pos.lo);
  const t={t0:cur.t0,t1:Date.now(),name:$('#name').value.trim(),plate:cur.plate||'',carId:cur.carId,from:cur.from,to:tmp.addr,k0:cur.k0,k1:k,km:+(k-cur.k0).toFixed(1),gps:+cur.gps.toFixed(1)};
  trips.unshift(t);ls.s('trips',trips);cur=null;ls.s('cur',null);
  $('#sum').innerHTML=`<h2>Fahrt gespeichert</h2><p><b>${esc(t.from)}</b><br>nach <b>${esc(t.to)}</b></p><p>Kilometerstand ${t.k0} bis ${t.k1}, <b>${nf(t.km)} km</b><br><span class="mut">Per GPS gemessen: ${nf(t.gps)} km</span></p>`;
  go('sDone');
};
$('#stop').onclick=()=>{navigator.geolocation?.clearWatch(wid);clearInterval(tick);wl?.release?.();mode='end';tmp={};ask()};
$('#fin').onclick=()=>{render();go('sHome')};
$('#copy').onclick=async e=>{
  const b=e.currentTarget,h=['Datum','Start','Ende','Fahrer','Kennzeichen','Von','Nach','km Start','km Ende','km gefahren','GPS km'].join('\t');
  const txt=[h,...trips.slice().reverse().map(t=>[dt(t.t0),tm(t.t0),tm(t.t1),t.name,t.plate,t.from,t.to,t.k0,t.k1,nf(t.km),nf(t.gps)].join('\t'))].join('\n');
  try{await navigator.clipboard.writeText(txt)}catch(_){const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
  const o=b.textContent;b.textContent='Kopiert';setTimeout(()=>{b.textContent=o},1800);
};

const th=ls.g('theme',null);if(th)R.dataset.theme=th;
ico();render();renderCars();
if(cur)drive();
</script>
</body>
</html>
